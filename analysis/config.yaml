system:
  data_dir: "/workspace/data"
  output_dir: "/workspace/app/realEstateAnalyzer/analysis_results"
  api_url: "http://localhost:8000/v1"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  api_key: "EMPTY"

prompts:
  system_prompt: |
    Role: Real Estate Investment Analyst (Wolbu Style)
    Background & Identity:
    당신은 '월급쟁이부자들'의 투자 철학을 완벽하게 숙지한 수석 부동산 투자 분석가입니다. 
    당신의 목표는 사용자가 제공한 '임장 보고서(이미지 및 텍스트)'를 정밀 분석하여, 특정 '지역(시/구)'의 저평가 여부와 투자 가치를 판단하는 것입니다.
    당신은 "잃지 않는 투자"를 제1원칙으로 하며, 숲(지역)을 먼저 보고 나무(단지)를 보는 Top-Down 방식을 선호합니다.

    Core Investment Philosophy:
    1. 저평가(Undervaluation): 지역 전체의 가격 수준이 전고점 대비 얼마나 하락했는지, 소득 대비 저평가 구간인지 확인한다.
    2. 입지 독점성(Location): 강남/여의도/광화문 접근성 및 학군지로서의 위상을 평가한다.
    3. 공급 리스크(Supply): 향후 3년간 해당 지역 및 인근 지역의 입주 물량을 확인하여 전세가 하락 리스크를 회피한다.
    4. 환금성(Liquidity): 지역 내 선호도가 높은 대장 단지들의 흐름을 주시한다.

  fact_extraction: |
    [STEP 1. 지역 및 단지 데이터 정밀 추출]
    제공된 임장 보고서의 텍스트와 표 이미지를 분석하여 다음 핵심 데이터를 JSON 형식으로 추출하십시오.
    
    [추출 항목]
    1. 지역 정보 (Regional Info):
       - region_name: 분석 대상 지역명 (예: 용인시 수지구, 성남시 분당구)
       - population: 인구수 (언급된 경우)
       - supply_status: 향후 3년 입주 물량 상태 (부족/적정/과잉)
    
    2. 입지 데이터 (J-T-S-E):
       - jobs_rating: 직장 등급 또는 평가 (S/A/B/C)
       - transport_rating: 교통 등급 또는 주요 노선 (신분당선, GTX 등)
       - school_rating: 학군 등급 또는 학업 성취도 평가
       - environment_rating: 환경/상권 등급 (백화점, 대형마트 등)

    3. 단지별 상세 분석 (Complexes):
       *보고서에 특정 단지에 대한 상세 분석(시세, 전세가율, 투자금 등)이 있는 경우에만 추출. 단순 언급은 제외.*
       - list of objects, each containing:
         - name: 단지명
         - price_current: 현재 매매가
         - gap_price: 투자금 (매매가 - 전세가)
         - comments: 해당 단지에 대한 핵심 코멘트 (1문장)

    [보고서 텍스트]
    {report_text}

  visual_verification: |
    [STEP 1-2. 시각적 데이터 정밀 분석 (Visual Extraction)]
    첨부된 지도, 차트, 그래프 이미지를 시각적으로 분석하여 텍스트 주장을 검증하십시오.

    [분석 항목]
    1. 지도(Map) 분석:
       - 지역 입지: 해당 지역의 위치가 주요 업무지구(강남 등)와 물리적/교통적으로 얼마나 가까운지 확인.
       - 생활권 구분: 상권, 학원가, 주거지가 어떻게 형성되어 있는지 시각적 확인.
    2. 차트(Chart) 분석:
       - 공급 물량 그래프: 향후 3년 내 공급 막대그래프가 적정 수요선을 초과하는지 시각적 검증.
       - 매매/전세 지수: 매매가와 전세가가 만나는지, 벌어지는지(버블/저평가) 추세 확인.

    [보고서 텍스트]
    {report_text}

    위 항목들에 대해 시각적 증거를 바탕으로 '검증됨', '불일치', '확인불가'로 판정하고 상세 근거를 서술하십시오.

  sentiment_analysis: |
    [임장 코멘트 및 지역 분위기 분석]
    보고서 작성자의 현장 방문(임장) 코멘트를 분석하여 해당 지역의 전반적인 분위기와 투자 심리를 파악하십시오.
    
    [분석 포인트]
    1. 지역 분위기: 활기찬 상권인지, 조용한 베드타운인지, 노후화된 구도심인지 등.
    2. 주민 특성: 젊은 부부, 학생, 노년층 등 주 거주층의 특성.
    3. 매수 심리: 현장 부동산 소장님들의 브리핑 내용(매수 문의 증가/실종, 급매 소진 등).

    [보고서 텍스트]
    {report_text}

  insight_generation: |
    [STEP 2~4. 지역 입지 평가 및 최종 투자 의견서 작성]
    앞선 팩트 추출, 시각적 검증, 리스크 분석 결과를 종합하여 '월급쟁이부자들' 스타일의 지역 분석 보고서를 작성하십시오.

    [입력 데이터]
    - 지역명: {region_name}
    - 팩트 데이터: {fact_data}
    - 시각적 검증: {verification_result}
    - 리스크/심리: {risk_analysis}

    [작성 양식 (Markdown)]
    # �️ {region_name} 지역 분석 보고서

    ## 1. 지역 개요 및 입지 등급 (Grade Evaluation)
    *각 입지 요소를 S/A/B/C 등급으로 평가하고 근거를 제시할 것.*
    - **직장 (Jobs)**: [등급] - (주요 출퇴근 권역 및 소요 시간)
    - **교통 (Traffic)**: [등급] - (핵심 지하철 노선 및 호재)
    - **학군 (School)**: [등급] - (특목고 진학률 및 학원가 규모)
    - **환경 (Environment)**: [등급] - (상권, 자연환경, 쾌적성)
    - **공급 (Supply)**: [안전/주의/위험] - (향후 3년 물량 분석)

    ## 2. 지역 분위기 및 임장 뉘앙스
    - **현장 분위기**: (주민들의 활력, 상권 이용 행태 등)
    - **부동산 사장님 코멘트**: (매수/매도 우위, 급매물 소진 속도 등)

    ## 3. 주요 단지 분석 (Top Picks)
    *보고서에 언급된 주요 단지들이 있다면 분석, 없으면 생략 가능*
    - **[단지명]**:
      - 투자금: (매매가 - 전세가)
      - 특징: (보고서 내용을 바탕으로 한 장점/단점)

    ## 4. 최종 투자 결론
    - **지역 평가**: [저평가 구간 / 적정 가치 / 고평가 주의]
    - **투자 전략**: (예: A급지인 OO구는 현재 전세가율이 낮아 투자금이 많이 들므로, B급지인 XX동을 먼저 보는 것이 유리함 등)
    - **Action Plan**: (구체적인 행동 지침)

    ---
    *Constraint: 추측을 배제하고 제공된 데이터와 시각적 증거에 기반하여 냉철하게 평가하십시오.*
