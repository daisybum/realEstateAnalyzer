_type: chat
name: sentiment_analysis
version: "1.0.0"
description: "임장 코멘트 및 지역 분위기 분석"
tags: ["prod", "core"]

input_variables:
  - report_text

messages:
  - role: system
    content_ref: base_system.yaml
    
  - role: user
    content: |
      [임장 코멘트 및 지역 분위기 분석]
      보고서 작성자의 현장 방문(임장) 코멘트를 분석하여 해당 지역의 전반적인 분위기와 투자 심리를 파악하십시오.
      
      [분석 포인트]
      1. 지역 분위기: 활기찬 상권인지, 조용한 베드타운인지, 노후화된 구도심인지 등.
      2. 주민 특성: 젊은 부부, 학생, 노년층 등 주 거주층의 특성.
      3. 매수 심리: 현장 부동산 소장님들의 브리핑 내용(매수 문의 증가/실종, 급매 소진 등).
      
      [보고서 텍스트]
      {report_text}

metadata:
  author: "realEstateAnalyzer"
  created_at: "2024-12-05"
