# =================================================================================
# Docker Compose for vLLM on Blackwell GPU
# =================================================================================
# Architecture: aarch64 (Grace CPU + Blackwell GPU)
# Features: CUDA 13.0 runtime, LangSmith integration, Multi-modal support
# =================================================================================

services:
  vllm-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-blackwell:cuda13.0-v0.12.0
    container_name: vllm-qwen3-vl-30b

    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

    environment:
      # ----- CUDA Configuration -----
      - CUDA_HOME=/usr/local/cuda-13.0
      - TRITON_PTXAS_PATH=/usr/local/cuda-13.0/bin/ptxas
      - TORCH_CUDA_ARCH_LIST=12.1a
      - NVCC_THREADS=8

      # ----- vLLM Configuration -----
      - VLLM_CONFIGURE_LOGGING=1
      - VLLM_LOGGING_LEVEL=INFO
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN

      # ----- Model Configuration -----
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      - TENSOR_PARALLEL_SIZE=${TENSOR_PARALLEL_SIZE:-1}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.90}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-65536}
      - TRUST_REMOTE_CODE=true

      # ----- External Services -----
      - HF_TOKEN=${HF_TOKEN:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-realEstateAnalyzer}

    volumes:
      # HuggingFace cache (avoid re-download)
      - ~/.cache/huggingface:/root/.cache/huggingface

      # Host CUDA 13.0 toolkit (Blackwell sm_121a support)
      - /usr/local/cuda-13.0:/usr/local/cuda-13.0:ro

      # Project workspace
      - ../../..:/workspace/app

      # Data directory (realEstateCrawler output)
      - ../../../realEstateCrawler/output:/workspace/data

      # Shared memory for multi-processing
      - /dev/shm:/dev/shm

    ports:
      - "8000:8000"

    ipc: host

    command: >
      vllm serve ${MODEL_NAME:-Qwen/Qwen3-VL-30B-A3B-Instruct} --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1} --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90} --max-model-len ${MAX_MODEL_LEN:-32768} --trust-remote-code --host 0.0.0.0 --port 8000 --allowed-local-media-path /workspace/app --allowed-local-media-path /workspace/data

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  huggingface-cache:
    driver: local
